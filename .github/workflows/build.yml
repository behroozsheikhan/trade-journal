name: CI — Test & Build

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    name: Unit + E2E tests (headless Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & component tests (Vitest)
        run: npm run test
      - name: UI tests (Playwright, headless)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  build-windows:
    name: Build Windows Setup.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build app + installer
        run: npm run dist:win
        env:
          # Optional signing secrets (leave unset for unsigned builds):
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/**/*.exe
            release/**/*.blockmap
          retention-days: 30
      - name: Publish release (on GitHub Releases)
        if: github.event_name == 'release'
        run: npx electron-builder --config electron-builder.yml --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux AppImage (smoke)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx electron-builder --config electron-builder.yml --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage
          retention-days: 14
