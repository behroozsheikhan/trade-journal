name: CI Test and Build

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  ELECTRON_VERSION: 33.4.11

jobs:
  test:
    name: Unit + E2E tests (headless Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node prefix for offline native builds
        run: echo "npm_config_nodedir=$(dirname "$(dirname "$(readlink -f "$(which node)")")")" >> "$GITHUB_ENV"
      - name: Install dependencies (Node ABI for Vitest)
        # Electron binary is not needed here (Playwright uses its own Chromium);
        # skipping it avoids the big github-release download in this job.
        run: npm ci --no-audit --no-fund || npm ci --no-audit --no-fund
        env:
          TJ_ELECTRON_REBUILD: "0"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Diagnose install failure
        if: failure()
        run: |
          for f in "$HOME"/.npm/_logs/*.log; do
            echo "::error::--- $f"
            grep -aiE "ERR!|error|404|403|401|ETIMEDOUT|ECONNRESET|socket|ENOTFOUND" "$f" | tail -40 | sed 's/^/::error::/'
          done
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests (Vitest)
        run: npm run test
      - name: UI tests (Playwright, headless)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/

  build-windows:
    name: Build Windows Setup.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Electron dist + builder cache
        uses: actions/cache@v4
        with:
          path: |
            %LOCALAPPDATA%\electron\Cache
            %LOCALAPPDATA%\electron-builder\Cache
          key: electron-${{ env.ELECTRON_VERSION }}-win-x64
          restore-keys: electron-${{ env.ELECTRON_VERSION }}-win-
      - name: Pre-download Electron dist (retries)
        shell: pwsh
        run: |
          $cache = "$env:LOCALAPPDATA\electron\Cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $base = "https://github.com/electron/electron/releases/download/v$env:ELECTRON_VERSION"
          curl.exe -L --retry 6 --retry-all-errors --retry-delay 15 -o "$cache\electron-v$env:ELECTRON_VERSION-win32-x64.zip" "$base/electron-v$env:ELECTRON_VERSION-win32-x64.zip"
          curl.exe -L --retry 6 --retry-all-errors --retry-delay 15 -o "$cache\SHASUMS256.txt" "$base/SHASUMS256.txt"
      - name: Install dependencies
        shell: pwsh
        run: |
          # nodedir only for THIS step (better-sqlite3 install script fallback);
          # must NOT leak into electron-builder's @electron/rebuild node-gyp calls.
          $env:npm_config_nodedir = Split-Path -Parent (Split-Path -Parent (Get-Command node).Source)
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::warning::npm ci attempt $i failed; retrying in 30s"
            Start-Sleep -Seconds 30
          }
          if (-not $ok) { exit 1 }
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          TJ_ELECTRON_REBUILD: "0"
      - name: Place better-sqlite3 Electron-ABI prebuild
        shell: pwsh
        run: |
          # Electron 33.x => NODE_MODULE_VERSION 130; prebuilt from GitHub releases (github.com is reachable).
          $abi = 130
          $url = "https://github.com/WiseLibs/better-sqlite3/releases/download/v12.11.1/better-sqlite3-v12.11.1-electron-v$abi-win32-x64.tar.gz"
          curl.exe -L --retry 6 --retry-all-errors --retry-delay 15 -o "$env:TEMPs3.tar.gz" $url
          tar -xzf "$env:TEMPs3.tar.gz" -C node_modulesetter-sqlite3
          New-Item -ItemType Directory -Force -Path node_modulesetter-sqlite3uild\Release | Out-Null
          $f = Get-ChildItem -Recurse node_modulesetter-sqlite3 -Filter better_sqlite3.node | Select-Object -First 1
          Copy-Item $f.FullName node_modulesetter-sqlite3uild\Releaseetter_sqlite3.node -Force
          if (-not (Test-Path node_modulesetter-sqlite3uild\Releaseetter_sqlite3.node)) { Write-Host "::error::prebuild placement failed"; exit 1 }
      - name: Diagnose install failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:USERPROFILE\.npm\_logs\*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object {
            Write-Host "::error::--- $($_.FullName)"
            Get-Content $_.FullName -Tail 70 | ForEach-Object { Write-Host "::error::$_" }
          }
      - name: Build app and installer (retries)
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 4; $i++) {
            npm run dist:win 2>&1 | Tee-Object -FilePath build.log
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::warning::dist:win attempt $i failed; retrying in 20s"
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { exit 1 }
      - name: Diagnose build failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            $lines = Get-Content build.log
            $idx = ($lines | Select-String -Pattern "⨯" | Select-Object -Last 1).LineNumber
            if ($idx) { $lines[([Math]::Max(0, $idx - 4))..([Math]::Min($lines.Count - 1, $idx + 24))] | ForEach-Object { Write-Host "::error::$_" } }
            else { $lines | Select-Object -Last 30 | ForEach-Object { Write-Host "::error::$_" } }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: windows-build-log
          path: build.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-installer
          path: |
            release/**/*.exe
            release/**/*.blockmap
          retention-days: 30
      - name: Publish to GitHub Releases (release events only)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            npx electron-builder --config electron-builder.yml --win --publish always 2>&1 | Tee-Object -FilePath publish.log
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::warning::publish attempt $i failed; retrying in 20s"
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { exit 1 }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: windows-publish-log
          path: publish.log
          retention-days: 7

  build-linux:
    name: Build Linux AppImage (smoke)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Electron dist + builder cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ env.ELECTRON_VERSION }}-linux-x64
          restore-keys: electron-${{ env.ELECTRON_VERSION }}-linux-
      - name: Pre-download Electron dist (retries)
        run: |
          mkdir -p ~/.cache/electron
          base="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}"
          curl -L --retry 6 --retry-all-errors --retry-delay 15 -o ~/.cache/electron/electron-v${ELECTRON_VERSION}-linux-x64.zip "$base/electron-v${ELECTRON_VERSION}-linux-x64.zip"
          curl -L --retry 6 --retry-all-errors --retry-delay 15 -o ~/.cache/electron/SHASUMS256.txt "$base/SHASUMS256.txt"
      - run: |
          export npm_config_nodedir="$(dirname "$(dirname "$(readlink -f "$(which node)")")")"
          npm ci --no-audit --no-fund || npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          TJ_ELECTRON_REBUILD: "0"
      - name: Place better-sqlite3 Electron-ABI prebuild
        run: |
          abi=130  # Electron 33.x => NODE_MODULE_VERSION 130
          curl -L --retry 6 --retry-all-errors --retry-delay 15 -o /tmp/bs3.tar.gz "https://github.com/WiseLibs/better-sqlite3/releases/download/v12.11.1/better-sqlite3-v12.11.1-electron-v${abi}-linux-x64.tar.gz"
          tar -xzf /tmp/bs3.tar.gz -C node_modules/better-sqlite3
          mkdir -p node_modules/better-sqlite3/build/Release
          f=$(find node_modules/better-sqlite3 -name better_sqlite3.node | head -1)
          cp "$f" node_modules/better-sqlite3/build/Release/better_sqlite3.node
          test -f node_modules/better-sqlite3/build/Release/better_sqlite3.node
      - name: Diagnose install failure
        if: failure()
        run: |
          for f in "$HOME"/.npm/_logs/*.log; do
            echo "::error::--- $f"
            grep -aiE "ERR!|error|404|403|401|ETIMEDOUT|ECONNRESET|socket|ENOTFOUND" "$f" | tail -40 | sed 's/^/::error::/'
          done
      - run: npm run build
      - name: Build AppImage (retries)
        run: |
          set -o pipefail
          for i in 1 2 3 4; do
            if npx electron-builder --config electron-builder.yml --linux --publish never 2>&1 | tee builder.log; then exit 0; fi
            echo "::warning::electron-builder attempt $i failed; retrying in 20s"
            sleep 20
          done
          exit 1
      - name: Diagnose builder failure
        if: failure()
        run: |
          { grep -aB3 -A25 "⨯" builder.log | head -60; echo "----- tail -----"; tail -25 builder.log; } | sed 's/^/::error::/' | head -70
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: linux-appimage
          path: release/*.AppImage
          retention-days: 14
