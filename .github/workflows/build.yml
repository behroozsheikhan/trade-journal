name: CI Test and Build

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Unit + E2E tests (headless Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node prefix for offline native builds
        run: echo "npm_config_nodedir=$(dirname "$(dirname "$(readlink -f "$(which node)")")")" >> "$GITHUB_ENV"
      - name: Install dependencies (Node ABI for Vitest)
        run: npm ci --no-audit --no-fund || npm ci --no-audit --no-fund
        env:
          TJ_ELECTRON_REBUILD: "0"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Diagnose install failure
        if: failure()
        run: |
          for f in "$HOME"/.npm/_logs/*.log; do
            echo "::error::--- $f"
            grep -aiE "ERR!|error|404|403|401|ETIMEDOUT|ECONNRESET|socket|ENOTFOUND" "$f" | tail -40 | sed 's/^/::error::/'
          done
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests (Vitest)
        run: npm run test
      - name: UI tests (Playwright, headless)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  build-windows:
    name: Build Windows Setup.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Electron dist zip
        uses: actions/cache@v4
        with:
          path: ~\.cache\electron
          key: electron-v33.4.11-win-x64
          restore-keys: electron-v33.4.11-win-
      - name: Node prefix for offline native builds
        shell: bash
        run: echo "npm_config_nodedir=$(dirname "$(dirname "$(readlink -f "$(which node)")")")" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Diagnose install failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$HOME/.npm/_logs/*.log" | ForEach-Object {
            Write-Host "::error::--- $($_.FullName)"
            Select-String -Path $_.FullName -Pattern "ERR!|error|404|403|401|ETIMEDOUT|ECONNRESET|socket|ENOTFOUND" | Select-Object -Last 40 | ForEach-Object { Write-Host "::error::$($_.Line)" }
          }
      - name: Build app and installer
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-log
          path: build.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/**/*.exe
            release/**/*.blockmap
          retention-days: 30
      - name: Publish to GitHub Releases (release events only)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          npx electron-builder --config electron-builder.yml --win --publish always 2>&1 | Tee-Object -FilePath publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-publish-log
          path: publish.log
          retention-days: 7

  build-linux:
    name: Build Linux AppImage (smoke)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Electron dist zip
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-v33.4.11-linux-x64
          restore-keys: electron-v33.4.11-linux-
      - name: Node prefix for offline native builds
        run: echo "npm_config_nodedir=$(dirname "$(dirname "$(readlink -f "$(which node)")")")" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund || npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Diagnose install failure
        if: failure()
        run: |
          for f in "$HOME"/.npm/_logs/*.log; do
            echo "::error::--- $f"
            grep -aiE "ERR!|error|404|403|401|ETIMEDOUT|ECONNRESET|socket|ENOTFOUND" "$f" | tail -40 | sed 's/^/::error::/'
          done
      - run: npm run build
      - run: npx electron-builder --config electron-builder.yml --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage
          retention-days: 14
